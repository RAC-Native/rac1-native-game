plugins {
    id("com.android.application")
}

def repoRoot = file("../../..")
def stagedAssetsDir = file("${buildDir}/generated/rac1Assets")

def resolveGeneratedSrc = {
    def candidates = [
        project.findProperty("RAC1_GENERATED_SRC"),
        System.getenv("RAC1_GENERATED_SRC"),
        new File(repoRoot, "assets/generated/src").absolutePath,
        "/home/daino/progetti/rac1-native-game/assets/generated/src"
    ]
    for (c in candidates) {
        if (c != null && !c.toString().isEmpty() && new File(c.toString()).isDirectory()) {
            return c.toString()
        }
    }
    return new File(repoRoot, "assets/generated/src").absolutePath
}

tasks.register("prepareRac1DataAssets", Copy) {
    from(new File(repoRoot, "data"))
    into(new File(stagedAssetsDir, "data"))
}

preBuild.dependsOn(tasks.named("prepareRac1DataAssets"))

android {
    namespace = "org.racnative.rac1"
    compileSdk = 34
    ndkVersion = "27.3.13750724"

    defaultConfig {
        applicationId = "org.racnative.rac1"
        minSdk = 29
        targetSdk = 34
        versionCode = 1
        versionName = "0.8.3"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                def cmakeArgs = [
                    "-DANDROID_STL=c++_static",
                    "-DCMAKE_BUILD_TYPE=RelWithDebInfo",
                    "-DRAC1_VULKAN=REQUIRED",
                    "-DRAC1_MOVIES=OFF",
                    "-DRAC1_GENERATED_SRC=" + resolveGeneratedSrc()
                ]
                def glslc = new File("/usr/bin/glslc")
                if (glslc.exists()) {
                    cmakeArgs.add("-DRAC1_GLSLC=" + glslc.absolutePath)
                }
                def py = new File("/home/daino/miniconda3/bin/python3")
                if (py.exists()) {
                    cmakeArgs.add("-DPython3_EXECUTABLE=" + py.absolutePath)
                }
                def depsBase = new File("/home/daino/progetti/rac1-native-game/build/_deps")
                if (depsBase.isDirectory()) {
                    ["glm", "imgui", "tinygltf", "miniaudio", "vulkan_headers", "volk"].each { dep ->
                        def srcDir = new File(depsBase, "${dep}-src")
                        if (srcDir.isDirectory()) {
                            cmakeArgs.add("-DFETCHCONTENT_SOURCE_DIR_" + dep.toUpperCase() + "=" + srcDir.absolutePath)
                        }
                    }
                }
                arguments(*cmakeArgs)
                targets "rac1-native"
            }
        }
    }

    buildTypes {
        debug {
            debuggable true
            jniDebuggable false
        }
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    sourceSets {
        main {
            assets.srcDirs += stagedAssetsDir
        }
    }

    externalNativeBuild {
        cmake {
            path = file("../../../CMakeLists.txt")
            version = "3.31.6"
        }
    }

    packaging {
        jniLibs {
            useLegacyPackaging = false
        }
    }
}
