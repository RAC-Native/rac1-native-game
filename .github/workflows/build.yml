# Builds rac1-native on Linux (x86-64, and ARM64 not blocking yet) and Windows, without the player's disc.
#
# Part of the game's code is generated from the game's own code on the player's disc (./setup.sh, see
# docs/architecture.md), and no disc is here: these builds use -DRAC1_NO_GENERATED=ON, which compiles
# everything else (the PS2 hardware layer, the formats, the platform layer, the setup mode, the debug
# menu, the host, and the game's hand-written code) and links nothing. They catch compile errors on
# each system and compiler; the game itself is built and checked on a machine with the disc
# (docs/platforms.md, "Verification").
name: build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  linux:
    name: Linux (GCC)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the build's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libgl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev glslc
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRAC1_NO_GENERATED=ON
      - name: Build
        run: cmake --build build -j 4

  linux-arm64:
    # (not blocking yet: the ARM64 port is in progress - #78, branch port/android - and parts of the PS2 layer still include
    # x86 intrinsics; it shows where a change breaks ARM64 builds. Make it blocking once it builds)
    name: Linux ARM64 (GCC, not blocking yet)
    runs-on: ubuntu-24.04-arm
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install the build's dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build g++ pkg-config libgl-dev \
            libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxi-dev libxext-dev \
            libwayland-dev libxkbcommon-dev
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DRAC1_NO_GENERATED=ON
      - name: Build
        run: cmake --build build -j 4 -- -k 0

  windows:
    name: Windows (MSYS2 CLANG64, clang)
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4
      - uses: msys2/setup-msys2@v2
        with:
          msystem: CLANG64
          update: true
          install: >-
            mingw-w64-clang-x86_64-clang
            mingw-w64-clang-x86_64-cmake
            mingw-w64-clang-x86_64-ninja
            mingw-w64-clang-x86_64-python
            mingw-w64-clang-x86_64-pkgconf
            mingw-w64-clang-x86_64-shaderc
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_C_COMPILER=clang -DCMAKE_CXX_COMPILER=clang++ -DRAC1_NO_GENERATED=ON
      - name: Build
        run: cmake --build build -j 4

  windows-cross:
    name: Windows from Linux (clang, MinGW-w64)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Install the cross-compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake ninja-build clang lld mingw-w64 glslc
      - name: Configure
        run: cmake -S . -B build-win -G Ninja -DCMAKE_BUILD_TYPE=RelWithDebInfo -DCMAKE_TOOLCHAIN_FILE=cmake/toolchains/clang-x86_64-w64-mingw32.cmake -DRAC1_NO_GENERATED=ON
      - name: Build
        run: cmake --build build-win -j 4
